<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="page.productTitle">Sheji Product</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="product-page">
    <nav class="language-switcher" aria-label="Language" data-language-switcher data-i18n-aria-label="languageSwitcher.label">
      <button class="language-switcher__option" type="button" data-language-option="en" aria-pressed="false" aria-label="English" data-i18n-aria-label="languageSwitcher.en">EN</button>
      <button class="language-switcher__option" type="button" data-language-option="ru" aria-pressed="false" aria-label="Russian" data-i18n-aria-label="languageSwitcher.ru">RU</button>
      <button class="language-switcher__option" type="button" data-language-option="zh" aria-pressed="false" aria-label="Chinese language slot" data-i18n-aria-label="languageSwitcher.zh" title="Chinese can be added later" data-i18n-title="languageSwitcher.zhTitle">ZH</button>
    </nav>
    <main class="product-page__main">
      <section
        class="product-detail"
        id="product-detail"
        aria-labelledby="product-detail-title"
        data-product-detail
      >
        <div class="product-detail__toolbar">
          <a class="product-detail__back" href="index.html#catalogue">
            <img src="source/icons/west.svg" alt="" />
            <span data-i18n="collection.back">Go back</span>
          </a>
        </div>

        <div class="cart-status-menu product-detail__cart-status">
          <div class="commerce-status" role="group" aria-label="Shopping and favorites" data-i18n-aria-label="commerce.navigation">
            <a
              class="commerce-status__action cart-status"
              href="cart.html"
              aria-label="Open cart, 0 items"
              aria-expanded="false"
            >
              <img src="source/icons/shopping_cart.svg" alt="" />
              <span class="visually-hidden" data-i18n="cart.label">Cart</span>
              <span class="commerce-status__count" data-cart-count>0</span>
            </a>
            <span class="commerce-status__divider" aria-hidden="true"></span>
            <a
              class="commerce-status__action favorite-status"
              href="favorites.html"
              aria-label="Open favorites, 0 items"
            >
              <img src="source/icons/favorite_border.svg" alt="" />
              <span class="visually-hidden" data-i18n="favorites.label">Favorites</span>
            </a>
          </div>
        </div>

        <div class="product-detail__stage">
          <button
            class="product-detail__nav product-detail__nav--prev"
            type="button"
            aria-label="Previous product"
            data-i18n-aria-label="product.previous"
            data-product-prev
          >
            <img src="source/icons/keyboard_arrow_left.svg" alt="" />
          </button>

          <article class="product-detail__product" aria-live="polite">
            <h1 class="visually-hidden" id="product-detail-title" data-product-title>
              <span data-i18n="product.detail">Product detail</span>
            </h1>
            <img class="product-detail__image" alt="" data-product-image />
          </article>

          <button
            class="product-detail__nav product-detail__nav--next"
            type="button"
            aria-label="Next product"
            data-i18n-aria-label="product.next"
            data-product-next
          >
            <img src="source/icons/keyboard_arrow_right.svg" alt="" />
          </button>
        </div>

        <div class="product-detail__purchase">
          <div class="product-detail__size-selector size-selector" data-size-selector>
            <button
              class="size-selector__trigger"
              type="button"
              data-size-trigger
              aria-expanded="false"
            >
              <span data-size-label data-i18n="product.size">Size</span>
            </button>
          </div>

          <button class="product-detail__add" type="button" data-product-add>
            <img src="source/icons/add.svg" alt="" />
            <span data-i18n="product.addToCart">Add to cart</span>
          </button>
        </div>

        <div
          class="product-detail__recommendations"
          aria-label="Recommended products"
          data-i18n-aria-label="product.recommendations"
          data-product-recommendations
        ></div>
      </section>
    </main>

    <script src="js/i18n.js"></script>
    <script src="data/collections.js"></script>
    <script src="data/products.js"></script>
    <script src="js/merchandising.js"></script>
    <script src="js/motion.js"></script>
    <script src="js/runtime.js"></script>
    <script src="js/collections.js"></script>
    <script src="js/catalogue.js"></script>
    <script src="js/product-detail.js"></script>
    <script src="js/collage.js"></script>
    <script src="js/search-menu.js"></script>
    <script src="script.js"></script>
  </body>
</html>
