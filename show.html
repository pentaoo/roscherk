<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="page.showsTitle">Sheji Shows</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="show-page">
    <main class="show-page__main">
      <section
        class="show-detail"
        aria-labelledby="show-detail-title"
        data-show-detail
      >
        <div class="show-detail__toolbar">
          <a class="show-detail__back" href="index.html#top">
            <img src="source/icons/west.svg" alt="" />
            <span data-i18n="collection.back">Go back</span>
          </a>
        </div>

        <article class="show-detail__body">
          <div class="show-detail__copy">
            <p class="show-detail__eyebrow" data-show-badge data-i18n="shows.latest">latest show</p>
            <h1 id="show-detail-title" data-show-title>Shows</h1>
            <dl class="show-detail__meta">
              <div>
                <dt data-i18n="shows.date">Date</dt>
                <dd data-show-date></dd>
              </div>
              <div>
                <dt data-i18n="shows.venue">Venue</dt>
                <dd data-show-venue></dd>
              </div>
              <div>
                <dt data-i18n="shows.city">City</dt>
                <dd data-show-city></dd>
              </div>
              <div>
                <dt data-i18n="shows.format">Format</dt>
                <dd data-show-format></dd>
              </div>
            </dl>
            <p class="show-detail__summary" data-show-summary></p>
            <div class="show-detail__details" data-show-details></div>
            <div class="show-detail__program" data-show-program></div>
          </div>

          <figure class="show-detail__hero-photo">
            <img src="" alt="" data-show-hero />
            <figcaption data-show-atmosphere></figcaption>
          </figure>
        </article>

        <section class="show-detail__section" aria-labelledby="show-pieces-title">
          <div class="show-detail__section-heading">
            <p data-show-collection></p>
            <h2 id="show-pieces-title" data-i18n="shows.shownPieces">Shown pieces</h2>
          </div>
          <div class="show-detail__pieces" data-show-pieces></div>
        </section>

        <section
          class="show-detail__section show-detail__gallery-section"
          aria-label="Event photos"
          data-i18n-aria-label="shows.gallery"
        >
          <div class="show-detail__section-heading">
            <p data-i18n="shows.heroPhoto">Event hero photo</p>
            <h2 data-i18n="shows.gallery">Event photos</h2>
          </div>
          <div class="show-detail__gallery" data-show-gallery></div>
        </section>

        <section class="show-detail__section" aria-labelledby="show-archive-title">
          <div class="show-detail__section-heading">
            <p data-i18n="shows.archiveEyebrow">archive rail</p>
            <h2 id="show-archive-title" data-i18n="shows.archive">More shows</h2>
          </div>
          <div class="show-detail__archive" data-show-archive></div>
        </section>
      </section>
    </main>

    <script src="js/i18n.js"></script>
    <script src="data/collections.js"></script>
    <script src="data/products.js"></script>
    <script src="data/events.js"></script>
    <script src="js/merchandising.js"></script>
    <script src="js/motion.js"></script>
    <script src="js/runtime.js"></script>
    <script src="js/collections.js"></script>
    <script src="js/catalogue.js"></script>
    <script src="js/product-detail.js"></script>
    <script src="js/collage.js"></script>
    <script src="js/search-menu.js"></script>
    <script src="js/shows.js"></script>
    <script src="script.js"></script>
  </body>
</html>
