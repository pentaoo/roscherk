<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="page.cartTitle">Sheji Cart</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="cart-page">
    <main class="cart-page__main">
      <section class="cart-detail" aria-labelledby="cart-title" data-cart-page>
        <div class="cart-detail__toolbar">
          <a class="cart-detail__back" href="index.html#catalogue">
            <img src="source/icons/west.svg" alt="" />
            <span data-i18n="collection.back">Go back</span>
          </a>
        </div>

        <header class="cart-detail__header">
          <p class="cart-detail__eyebrow" data-i18n="cart.eyebrow">sheji bag</p>
          <h1 id="cart-title" data-i18n="cart.title">Cart</h1>
          <p class="cart-detail__summary" data-cart-summary>0 items</p>
        </header>

        <div class="cart-detail__empty" data-cart-empty hidden>
          <p data-i18n="cart.empty">Cart is empty.</p>
          <a class="cart-detail__shop-link" href="index.html#catalogue" data-i18n="cart.findClothes">Find clothes</a>
        </div>

        <div class="cart-detail__list" data-cart-list></div>

        <footer class="cart-detail__footer" data-cart-footer hidden>
          <button class="cart-detail__clear" type="button" data-cart-action="clear">
            <span data-i18n="cart.clear">Clear cart</span>
          </button>
          <p class="cart-detail__total">
            <span data-i18n="cart.total">Total</span>
            <strong data-cart-total>0$</strong>
          </p>
        </footer>
      </section>
    </main>

    <script src="js/i18n.js"></script>
    <script src="data/collections.js"></script>
    <script src="data/products.js"></script>
    <script src="js/merchandising.js"></script>
    <script src="js/motion.js"></script>
    <script src="js/runtime.js"></script>
    <script src="js/catalogue.js"></script>
    <script src="js/cart.js"></script>
  </body>
</html>
